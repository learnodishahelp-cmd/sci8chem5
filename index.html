<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Video Pages | YouTube Thumbnails</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .mobile-frame {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(80, 20, 40, 0.2);
            padding: 18px 14px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid rgba(200, 100, 130, 0.4);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 8px;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #880e4f;
            background: rgba(255, 200, 210, 0.8);
            padding: 6px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .page-indicator {
            background: #fce4ec;
            border-radius: 30px;
            padding: 6px 16px;
            font-weight: 600;
            color: #880e4f;
            font-size: 0.9rem;
        }
        .card {
            background: #fffffffa;
            border-radius: 32px;
            padding: 20px 16px;
            box-shadow: 0 12px 28px rgba(80, 30, 50, 0.1);
            border: 1px solid #f48fb1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .page {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .page.active {
            display: flex;
        }
        .video-thumb-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            background: #000;
        }
        .video-thumb-container img {
            width: 100%;
            display: block;
        }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 0, 0, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-overlay::after {
            content: '';
            border: 14px solid transparent;
            border-left: 24px solid white;
            margin-left: 4px;
        }
        .watch-btn {
            background: #ff0000;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 32px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(255,0,0,0.3);
            width: 100%;
        }
        .watch-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
        .video-title {
            font-weight: 600;
            color: #880e4f;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 5px;
            font-size: 1rem;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .nav-btn {
            background: linear-gradient(135deg, #ad1457, #880e4f);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 32px;
            font-size: 1rem;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(136, 14, 79, 0.3);
            transition: 0.2s;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
        .nav-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            background: #888;
        }
    </style>
</head>
<body>
<div class="mobile-frame">
    <div class="header">
        <h1>🎬 Video Hub</h1>
        <div class="page-indicator" id="pageTitle">1 / 2</div>
    </div>

    <div class="card">
        <!-- Page 1: Main Video -->
        <div id="page1" class="page active">
            <div class="video-title">▶ Main Video</div>
            <div class="video-thumb-container" onclick="window.open('https://www.youtube.com/watch?v=86tLx_cKlMM', '_blank')">
                <img src="https://img.youtube.com/vi/86tLx_cKlMM/maxresdefault.jpg" alt="Main Video" onerror="this.src='https://img.youtube.com/vi/86tLx_cKlMM/hqdefault.jpg'">
                <div class="play-overlay"></div>
            </div>
            <a href="https://www.youtube.com/watch?v=86tLx_cKlMM" target="_blank" class="watch-btn">
                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                Watch on YouTube
            </a>
        </div>

        <!-- Page 2: Shorts & Extra Video -->
        <div id="page2" class="page">
            <div class="video-title">▶ YouTube Shorts</div>
            <div class="video-thumb-container" onclick="window.open('https://www.youtube.com/shorts/ahz2BuXZyUc', '_blank')">
                <img src="https://img.youtube.com/vi/ahz2BuXZyUc/maxresdefault.jpg" alt="Shorts Video" onerror="this.src='https://img.youtube.com/vi/ahz2BuXZyUc/hqdefault.jpg'">
                <div class="play-overlay"></div>
            </div>
            <a href="https://www.youtube.com/shorts/ahz2BuXZyUc" target="_blank" class="watch-btn">
                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                Watch Shorts
            </a>

            <div class="video-title">▶ Additional Video</div>
            <div class="video-thumb-container" onclick="window.open('https://www.youtube.com/watch?v=YI4oaE7ZRdA', '_blank')">
                <img src="https://img.youtube.com/vi/YI4oaE7ZRdA/maxresdefault.jpg" alt="Extra Video" onerror="this.src='https://img.youtube.com/vi/YI4oaE7ZRdA/hqdefault.jpg'">
                <div class="play-overlay"></div>
            </div>
            <a href="https://www.youtube.com/watch?v=YI4oaE7ZRdA" target="_blank" class="watch-btn">
                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                Watch on YouTube
            </a>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" disabled>◀ Previous</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
    </div>
</div>

<script>
    (function() {
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageTitle = document.getElementById('pageTitle');

        let currentPage = 1;
        const totalPages = 2;

        function showPage(num) {
            if (num === 1) {
                page1.classList.add('active');
                page2.classList.remove('active');
                pageTitle.textContent = '1 / 2';
                prevBtn.disabled = true;
                nextBtn.disabled = false;
            } else {
                page1.classList.remove('active');
                page2.classList.add('active');
                pageTitle.textContent = '2 / 2';
                prevBtn.disabled = false;
                nextBtn.disabled = true;
            }
            currentPage = num;
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage === 2) showPage(1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage === 1) showPage(2);
        });

        // initial
        showPage(1);
    })();
</script>
</body>
</html>
